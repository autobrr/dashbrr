root = "."
tmp_dir = ".air-tmp"

[build]
cmd = "go build -o ./.air-tmp/dashbrr ./cmd/dashbrr/main.go"
bin = "./.air-tmp/dashbrr"
full_bin = "./.air-tmp/dashbrr serve --db-file ./data/dashbrr.db"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = [".air-tmp", ".git", "data", "web/node_modules", "web/dist"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
