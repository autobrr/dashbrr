# Example Kubernetes manifest bundle for Dashbrr service discovery.
#
# Apply:
#   kubectl apply -f docs/k8s_discovery_example.yaml
#
# Important:
# - Dashbrr resolves ${ENV_VAR} placeholders from its own process env.
# - Set matching env vars on the Dashbrr Deployment/Pod (example below).
# - Enable the sync in serve with DASHBRR__K8S_DISCOVERY_ENABLED=true.
# - With DASHBRR__K8S_DISCOVERY_NAMESPACES empty, Dashbrr scans only its own
#   namespace, and this Role is sufficient. For "*" (all namespaces), use a
#   ClusterRole and a ClusterRoleBinding with the same rules.

apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashbrr
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashbrr-discovery
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashbrr-discovery
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashbrr-discovery
subjects:
  - kind: ServiceAccount
    name: dashbrr
    namespace: media
---
# Env for the Dashbrr container (snippet only; merge into your Deployment).
# The Secret can come from an ExternalSecret.
#
#   env:
#     - name: DASHBRR__K8S_DISCOVERY_ENABLED
#       value: "true"
#     - name: DASHBRR_RADARR_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: dashbrr-api-keys
#           key: radarr
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
  annotations:
    com.dashbrr.service.type: "radarr"
    com.dashbrr.service.url: "http://radarr.media.svc.cluster.local:7878"
    com.dashbrr.service.apikey: "${DASHBRR_RADARR_API_KEY}"
    com.dashbrr.service.name: "Radarr"
    com.dashbrr.service.access_url: "https://radarr.example.com"
    com.dashbrr.service.enabled: "true"
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: media
  annotations:
    com.dashbrr.service.type: "traefik"
    com.dashbrr.service.url: "http://traefik.media.svc.cluster.local:8080"
    com.dashbrr.service.name: "Traefik"
    com.dashbrr.service.enabled: "true"
spec:
  selector:
    app: traefik
  ports:
    - name: dashboard
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: custom-health
  namespace: media
  annotations:
    com.dashbrr.service.type: "general"
    com.dashbrr.service.url: "http://custom-health.media.svc.cluster.local:8080/healthz"
    com.dashbrr.service.name: "Custom Health"
    com.dashbrr.service.enabled: "true"
spec:
  selector:
    app: custom-health
  ports:
    - name: http
      port: 8080
      targetPort: 8080
