name: Sync with upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/autobrr/dashbrr.git || true

      - name: Fetch upstream (branches and tags)
        run: git fetch upstream develop --tags

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/develop --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream: $BEHIND"

      - name: Attempt fast-forward merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          if git merge --ff-only upstream/develop 2>/dev/null; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fast-forward merge
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        run: git push origin develop

      - name: Sync upstream tags
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.behind == '0'
        run: |
          NEW_TAGS=$(comm -23 \
            <(git ls-remote --tags upstream | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort) \
            <(git ls-remote --tags origin  | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort))

          if [ -z "$NEW_TAGS" ]; then
            echo "No new upstream tags to sync"
            exit 0
          fi

          echo "Syncing new tags: $(echo "$NEW_TAGS" | tr '\n' ' ')"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            git push origin "refs/tags/$tag"
          done <<< "$NEW_TAGS"

      - name: Create sync PR on conflicts
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'false'
        run: |
          BRANCH="claude/upstream-sync-$(date +%Y%m%d)"
          git checkout -b "$BRANCH" upstream/develop
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: upstream sync — manual conflict resolution needed" \
            --body "Automatic weekly sync detected commits in autobrr/dashbrr:develop that cannot be fast-forwarded into develop. Please resolve conflicts and merge this PR." \
            --base develop \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

